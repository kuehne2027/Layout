<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Montar Layout SVC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{fontFamily:{display:['Unbounded','system-ui','sans-serif'],sans:['Onest','system-ui','sans-serif'],mono:['"JetBrains Mono"','ui-monospace','monospace']},
colors:{ink:'var(--ink)',muted:'var(--muted)',line:'var(--line)',accent:'var(--accent)',glass:'var(--glass)'}}}}
</script>
<style>
/* Layout: nav fixa translúcida (estilo Apple) → Bento Grid de vidro sobre fundo com gradientes suaves; planta do galpão como bloco principal */
:root{
  --bg:#07090d; --ink:#eef2f5; --muted:#8c97a3; --line:rgba(255,255,255,.09); --glass:rgba(22,27,34,.55);
  --accent:#4cc3ff; --amber:#ffb547;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:Onest,system-ui,sans-serif;min-height:100%;overflow-x:hidden}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:none;opacity:.10}
.aurora i:nth-child(1){width:46vw;height:46vw;left:-12vw;top:-14vw;background:#0e6d9c}
.aurora i:nth-child(2){width:38vw;height:38vw;right:-10vw;top:18vh;background:#b86b12;opacity:.16}
.aurora i:nth-child(3){width:50vw;height:40vw;left:30vw;bottom:-22vw;background:#123f7a;opacity:.3}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:22px 22px}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--line)}
.sk{background:linear-gradient(90deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.04) 100%);background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:10px}
@keyframes sh{to{background-position:-200% 0}}
.tnum{font-variant-numeric:tabular-nums}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spin{animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.45}}
.noscroll::-webkit-scrollbar{display:none}.noscroll{scrollbar-width:none}
@media (prefers-reduced-motion:reduce){.sk,.spin{animation:none}}

/* Otimização segura: mantém React/Framer originais */
.glass{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}


/* SVC FAST UI: preserva componentes e elimina custo visual de transições/blur */
.glass{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
</style>

<div class="aurora"><i></i><i></i><i></i></div>
<div class="grain"></div>
<div id="root" class="relative z-10"></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/framer-motion@11.11.17/dist/framer-motion.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
/* Bibliotecas pesadas sob demanda: a tela abre primeiro. */
const SVC_LIBS={};
function svcLoadOne(url){return new Promise((resolve,reject)=>{const e=document.createElement("script");e.src=url;e.async=true;e.onload=()=>resolve(true);e.onerror=()=>{e.remove();reject(new Error("Falha "+url))};document.head.appendChild(e)})}
/* tenta cada endereço em ordem: se a rede da empresa bloquear um CDN, usa o próximo */
function svcLoadScript(key,urls,ok){
  if(SVC_LIBS[key])return SVC_LIBS[key];
  urls=[].concat(urls);
  SVC_LIBS[key]=(async()=>{for(const u of urls){try{await svcLoadOne(u);if(!ok||ok())return true}catch(e){}}delete SVC_LIBS[key];throw new Error("Falha ao carregar "+key)})();
  return SVC_LIBS[key];
}
const ensureXLSX=()=>window.XLSX?Promise.resolve(true):svcLoadScript("xlsx",["https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js","https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js","https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"],()=>!!window.XLSX);
const ensureJSPDF=()=>window.jspdf?Promise.resolve(true):svcLoadScript("jspdf",["https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js","https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js","https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"],()=>!!window.jspdf);
const ensureSupabaseLib=()=>window.supabase?Promise.resolve(true):svcLoadScript("supabase",["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2","https://unpkg.com/@supabase/supabase-js@2"],()=>!!window.supabase);
/* lê CSV/TXT respeitando a codificação (UTF-8, UTF-16 do Excel "Texto Unicode" ou ANSI/Latin-1) */
async function svcReadText(f){const buf=new Uint8Array(await f.arrayBuffer());
  if(buf[0]===0xFF&&buf[1]===0xFE)return new TextDecoder("utf-16le").decode(buf.subarray(2));
  if(buf[0]===0xFE&&buf[1]===0xFF)return new TextDecoder("utf-16be").decode(buf.subarray(2));
  if(buf.length>3&&buf[1]===0&&buf[3]===0&&buf[0]!==0)return new TextDecoder("utf-16le").decode(buf);
  try{return new TextDecoder("utf-8",{fatal:true}).decode(buf).replace(/^\uFEFF/,"")}catch(e){return new TextDecoder("windows-1252").decode(buf)}}
/* abre qualquer planilha (xlsx/xls/xlsm/csv/txt) e devolve o workbook */
async function svcReadWorkbook(f,opts){await ensureXLSX();
  if(/\.(csv|txt|tsv)$/i.test(f.name)){let t=await svcReadText(f);const first=(t.split(/\r?\n/).find(l=>l.trim())||"");
    if(first.includes("\t"))return XLSX.read(t,{type:"string",raw:true,FS:"\t",...(opts||{})});
    if(first.split(";").length>first.split(",").length)return XLSX.read(t,{type:"string",raw:true,FS:";",...(opts||{})});
    return XLSX.read(t,{type:"string",raw:true,...(opts||{})})}
  return XLSX.read(new Uint8Array(await f.arrayBuffer()),{type:"array",...(opts||{})})}
/* ============ DADOS ============ */
const CARRIERS={
  AL:{n:"ALC",bg:"#111111",fg:"#ffffff"},
  EC:{n:"ECO EXPRESS",bg:"#f6e2c0",fg:"#1b1b1b"},
  MS:{n:"M.J SIMÕES",bg:"#8a8a8a",fg:"#ffffff"},
  HW:{n:"HAWK",bg:"#16357a",fg:"#ffffff"},
  ME:{n:"MELI EXTRA",bg:"#f4c7ad",fg:"#1b1b1b"},
  PL:{n:"PRALOG",bg:"#7b5ea7",fg:"#ffffff"},
  OT:{n:"ONTIME",bg:"#ffef2e",fg:"#1b1b1b"},
  PC:{n:"PARCEIRO",bg:"#ffffff",fg:"#1b1b1b"},
  KG:{n:"KANGU",bg:"#f39200",fg:"#1b1b1b"},
  DL:{n:"DELUNA",bg:"#4f7a2e",fg:"#ffffff"},
  CM:{n:"COOPMETRO",bg:"#22e024",fg:"#1b1b1b"},
  DC:{n:"DECARGO",bg:"#22e6ea",fg:"#1b1b1b"},
  PY:{n:"PY",bg:"#b8860b",fg:"#ffffff"},
  AV:{n:"AVTLOG",bg:"#0f766e",fg:"#ffffff"},
  X:{n:"Bloqueada",bg:"#e5262a",fg:"#ffffff"},
  V:{n:"Vazia",bg:"#e9ecef",fg:"#8a929b"}
};
function fill(o,a,b,code,s=1){if(a<=b){for(let i=a;i<=b;i+=s)o[i]=code}else{for(let i=a;i>=b;i-=s)o[i]=code}return o}
const build=steps=>{const o={};steps.forEach(st=>fill(o,...st));return o};
const LAYOUTS={
  "AM0-CHP":{map:build([[1,31,"X",2],[2,4,"AL",2],[6,8,"CM",2],[10,20,"KG",2],[22,26,"MS",2],[28,34,"X",2],
    [35,43,"HW"],[44,44,"X"],[45,49,"OT"],[50,50,"X"],[51,52,"DC"],[53,53,"X"],[54,54,"EC"],[55,55,"X"],[56,56,"DL"],[57,65,"X"],
    [88,76,"X"],[75,75,"DL"],[74,72,"EC"],[71,71,"OT"],[70,69,"PC"],[68,67,"HW"],[66,66,"CM"],[89,97,"X"]]),
    tags:{},veh:{top:"Passeio",bot:"VUC",right:"VUC"}},
  "AM":{map:build([[1,31,"ME",2],[2,8,"PC",2],[10,22,"KG",2],[24,34,"ME",2],
    [35,38,"PC"],[39,45,"DL"],[46,49,"MS"],[50,54,"AL"],[55,60,"DC"],[61,65,"X"],
    [88,79,"HW"],[78,74,"CM"],[73,73,"PY"],[72,69,"EC"],[68,66,"OT"],[89,97,"X"]]),
    tags:{},veh:{top:"Passeio",bot:"Passeio",right:"VUC"}},
  "PM":{map:build([[1,9,"DC",2],[11,17,"MS",2],[19,23,"EC",2],[25,31,"CM",2],[2,4,"KG",2],[6,6,"PY"],[8,14,"OT",2],[16,22,"DL",2],[24,34,"PC",2],
    [35,39,"KG"],[40,65,"ME"],
    [88,83,"HW"],[82,81,"AL"],[80,77,"DL"],[76,76,"DC"],[75,75,"OT"],[74,74,"EC"],[73,72,"PC"],[71,66,"HW"],[89,97,"HW"]]),
    tags:{},veh:{top:"Passeio",bot:"VUC",right:"VUC"}},
  "SD":{map:build([[1,31,"X",2],[2,6,"DC",2],[8,8,"EC"],[10,14,"OT",2],[16,20,"MS",2],[22,34,"HW",2],
    [35,37,"PC"],[38,40,"DL"],[41,42,"CM"],[43,50,"KG"],[51,65,"X"],[88,66,"X"],[89,97,"X"]]),
    tags:{},
    tagBelow:true,veh:{top:"Passeio",bot:"—",right:"VUC"}}
};
const rua=v=>v<=34?(v%2?1:2):v<=65?3:v<=88?5:4;
const area=v=>["","Rua 1 · coluna esquerda (ímpares)","Rua 2 · coluna esquerda (pares)","Rua 3 · ao lado da esteira","Rua 4 · lado direito (VUC)","Rua 5 · frente do mezanino (expedição VUC)"][rua(v)];
const vehOf=(L,v)=>v<=34?"—":v<=65?L.veh.top:v<=88?L.veh.bot:L.veh.right;
const SZ=36,STEP=42;
function pos(v){
  if(v<=34){const r=Math.floor((v-1)/2);return{x:v%2?40:86,y:98+r*STEP}}
  if(v<=65)return{x:128+(v-35)*STEP,y:56};
  if(v<=88)return{x:204+(88-v)*STEP,y:606};
  return{x:1320,y:250+(v-89)*STEP};
}
const BLOCKS_DEF={
  rampaS:{x:10,y:8,w:80,h:40,t:"RAMPA\nSAÍDA"},rampaU:{x:1300,y:130,w:98,h:40,t:"RAMPA ↑"},rampaU1:{x:1300,y:760,w:98,h:44,t:"RAMPA ↑ 1"},
  est1:{x:250,y:214,w:1000,h:24,t:"ESTEIRA"},est2:{x:250,y:296,w:1000,h:24,t:"ESTEIRA"},mez:{x:250,y:388,w:480,h:58,t:"MEZANINO"},
  exp:{x:190,y:592,w:986,h:66,t:"",dashed:true}};
const TAGS_DEF={1:{x:36,y:70},2:{x:84,y:70},3:{x:128,y:4},4:{x:1316,y:222},5:{x:204,y:578}};
const CAPS_DEF={3:{x:200,y:140},5:{x:204,y:684},4:{x:1250,y:636}};
// onde fica o nome da gaiola/rota em relação à vaga (x = centro do rótulo, ou esquerda se side)
const shortTag=t=>String(t||"").replace(/_[A-Z]{2,4}\d*$/i,"");
function tagPlace(v,below,len){const r=rua(v);const two=len>5&&v%2===0;
  if(r===3)return below?{cx:SZ/2,y:SZ+3+(two?17:0)}:{cx:SZ/2,y:two?-35:-18};
  if(r===5)return{cx:SZ/2,y:SZ+3+(two?17:0)};
  if(r===1)return{left:true,y:SZ/2-8};
  return{side:true,x:SZ+4,y:SZ/2-8}}
function mergeGeo(p){p=p||{};const slots={};for(let v=1;v<=97;v++)slots[v]=(p.slots&&p.slots[v])||pos(v);
  const blocks={};Object.keys(BLOCKS_DEF).forEach(k=>blocks[k]={...BLOCKS_DEF[k],...((p.blocks||{})[k]||{})});
  const tags={},caps={};[1,2,3,4,5].forEach(n=>{tags[n]=(p.tags||{})[n]||TAGS_DEF[n];if(CAPS_DEF[n])caps[n]=(p.caps||{})[n]||CAPS_DEF[n]});
  return {slots,blocks,tags,caps}}
function geoBounds(G){let W=0,H=0;Object.values(G.slots).forEach(p=>{W=Math.max(W,p.x+SZ);H=Math.max(H,p.y+SZ)});
  Object.values(G.blocks).forEach(b=>{W=Math.max(W,b.x+b.w);H=Math.max(H,b.y+b.h)});Object.values(G.caps).forEach(c=>{W=Math.max(W,c.x+150);H=Math.max(H,c.y+16)});
  return {W:Math.max(W+12,400),H:Math.max(H+16,300)}}
const capText=(L,n)=>n===3?"Rua 3 · "+L.veh.top+"   ←   sentido de saída":n===5?"Rua 5 · Expedição VUC"+(L.veh.bot&&L.veh.bot!=="—"?" · "+L.veh.bot:""):"Rua 4 · "+L.veh.right;
const allV=()=>{const m={};for(let v=1;v<=97;v++)m[v]="V";return m};
const EMPTY_MAP=allV();
const layoutVazio=L=>!Object.values(L.map).some(k=>k!=="V");
function groups(L){const g={};Object.entries(L.map).forEach(([v,k])=>(g[k]=g[k]||[]).push(+v));Object.values(g).forEach(a=>a.sort((x,y)=>x-y));return g}
function ranges(arr){const out=[];let i=0;while(i<arr.length){let j=i;const step=(arr[i]<=34&&arr[i+1]-arr[i]===2)?2:1;
  while(j+1<arr.length&&arr[j+1]-arr[j]===step&&(step===1||arr[j+1]<=34))j++;
  out.push(j>i?`${arr[i]}–${arr[j]}${step===2?" (ímpar/par)":""}`:`${arr[i]}`);i=j+1}return out.join(", ")}

/* ============ UI ============ */
const {useState,useEffect,useRef,useMemo}=React;
const {motion,AnimatePresence,LayoutGroup}=Motion;
const html=htm.bind(React.createElement);
const spring={type:"spring",stiffness:420,damping:32};
const tactile={};
const stagger={hidden:{},show:{transition:{staggerChildren:0,delayChildren:0}}};
const rise={hidden:{opacity:1,y:0},show:{opacity:1,y:0,transition:{duration:0}}};

function Swatch({k,size="sm"}){const c=CARRIERS[k];const cls=size==="lg"?"text-sm px-2.5 py-1 rounded-lg":"text-[10px] px-1.5 py-0.5 rounded-md";
  return html`<span class=${"font-mono font-bold inline-block "+cls} style=${{background:c.bg,color:c.fg,boxShadow:"inset 0 0 0 1px rgba(0,0,0,.25)"}}>${k}</span>`}

function Nav({cur,setCur}){
  return html`<header class="fixed top-0 inset-x-0 z-50" style=${{paddingTop:"env(safe-area-inset-top,0px)"}}>
    <div class="glass !border-x-0 !border-t-0" style=${{background:"rgba(7,9,13,.62)"}}>
      <nav class="max-w-7xl mx-auto px-4 h-14 flex items-center gap-4">
        <div class="flex items-center gap-2 shrink-0">
          <span class="w-2 h-2 rounded-full" style=${{background:"var(--accent)",boxShadow:"0 0 12px var(--accent)"}}></span>
          <span class="font-display text-[13px] tracking-tight">SVC<span class="text-muted font-sans font-medium"> · Montar layout</span></span>
        </div>
        <${LayoutGroup} id="tabs">
          <div class="ml-auto flex gap-1 overflow-x-auto noscroll p-1 rounded-full" style=${{background:"rgba(255,255,255,.05)"}} role="tablist">
            ${Object.keys(LAYOUTS).map(k=>html`<${motion.button} key=${k} id=${"tab-"+k} role="tab" aria-selected=${k===cur} onClick=${()=>setCur(k)}
              class=${"relative shrink-0 px-3.5 sm:px-4 py-1.5 rounded-full text-[13px] font-medium transition-colors "+(k===cur?"text-black":"text-muted hover:text-ink")}>
              ${k===cur&&html`<${motion.span} layoutId="pill" class="absolute inset-0 rounded-full" style=${{background:"var(--ink)"}} transition=${spring}/>`}
              <span class="relative">${k}</span>
            </${motion.button}>`)}
          </div>
        </${LayoutGroup}>
      </nav>
    </div>
  </header>`;
}

function Card({className="",children,title,right}){
  return html`<${motion.section} variants=${rise} class=${"glass rounded-3xl p-4 sm:p-5 min-w-0 "+className}
      transition=${{duration:0}}>
    ${title&&html`<div class="flex items-center justify-between gap-3 mb-3"><h2 class="text-[11px] uppercase tracking-[.16em] text-muted font-semibold">${title}</h2>${right}</div>`}
    ${children}
  </${motion.section}>`;
}

function Skeleton(){
  const b=(c)=>html`<div class=${"glass rounded-3xl p-6 "+c}><div class="sk h-3 w-24 mb-5"></div><div class="sk h-8 w-2/3 mb-3"></div><div class="sk h-3 w-1/2"></div></div>`;
  return html`<div class="grid grid-cols-1 md:grid-cols-12 gap-4">
    ${b("md:col-span-8 h-48")}${b("md:col-span-4 h-48")}
    <div class="glass rounded-3xl p-6 md:col-span-12"><div class="sk h-3 w-32 mb-5"></div><div class="sk w-full" style=${{height:"min(52vw,560px)"}}></div></div>
    ${b("md:col-span-7 h-72")}${b("md:col-span-5 h-72")}
  </div>`;
}

function Hero({cur,L,onClose}){
  const g=groups(L);const total=Object.keys(L.map).length-(g.V||[]).length;const bloq=(g.X||[]).length;
  const n=Object.keys(g).filter(k=>k!=="X"&&k!=="V").length;const vazio=layoutVazio(L);
  const stat=(v,l,color)=>html`<div class="min-w-0"><div class="font-display text-2xl sm:text-3xl tnum leading-none" style=${{color}}>${v}</div><div class="text-muted text-[11px] mt-1">${l}</div></div>`;
  return html`<${Card} className="md:col-span-8">
    <div class="flex items-center justify-between gap-2"><div class="text-[11px] uppercase tracking-[.16em] text-muted font-semibold">Layout do SVC</div>${onClose&&html`<button type="button" onClick=${onClose} class="text-xs text-muted hover:text-ink">Recolher</button>`}</div>
    <h1 class="font-display text-3xl sm:text-4xl tracking-tight mt-1 mb-3" style=${{textWrap:"balance"}}>
      <${AnimatePresence} mode="wait"><${motion.span} key=${cur} class="inline-block" initial=${{opacity:0,y:14}} animate=${{opacity:1,y:0}} exit=${{opacity:0,y:-14}} transition=${{duration:.3}}>${cur}</${motion.span}></${AnimatePresence}>
    </h1>
    ${vazio?html`<div class="rounded-xl px-3 py-2 text-xs max-w-lg" style=${{background:"rgba(255,181,71,.1)",color:"var(--amber)"}}>Nenhum layout ${cur} carregado neste navegador. Use <b>Ler desenho</b> no painel acima e mande o print do dia.</div>`:html`
    <div class="grid grid-cols-3 gap-4 max-w-md">
      ${stat(total-bloq,"vagas ativas","var(--ink)")}
      ${stat(bloq,"bloqueadas (X)","#ff6b6e")}
      ${stat(n,"transportadoras","var(--accent)")}
    </div>
    <div class="text-muted text-[11px] mt-2">${L.readAt?"Montado em "+L.readAt+" · para trocar, leia o desenho do dia ou use Limpar layout em Editar layout":""}</div>`}
  </${Card}>`;
}

function Search({L,onPick}){
  const [q,setQ]=useState("");const v=parseInt(q,10);const k=L.map[v];
  return html`<${Card} className="md:col-span-4" title="Buscar vaga">
    <label for="busca" class="sr-only">Número da vaga</label>
    <input id="busca" inputmode="numeric" value=${q} onInput=${e=>{setQ(e.target.value.replace(/\D/g,"").slice(0,2));const n=parseInt(e.target.value,10);if(L.map[n])onPick(n)}}
      placeholder="Ex.: 73" class="w-full bg-white/5 border border-line rounded-xl px-3 py-2 font-display text-xl tnum placeholder:text-white/20 outline-none focus:border-[var(--accent)] transition-colors"/>
    <div class="mt-2 min-h-[40px]">
      <${AnimatePresence} mode="wait">
        ${k?html`<${motion.div} key=${v+k} initial=${{opacity:0,scale:.96}} animate=${{opacity:1,scale:1}} exit=${{opacity:0}} class="flex items-center gap-3">
            <${Swatch} k=${k} size="lg"/>
            <div class="min-w-0"><div class="font-semibold">${CARRIERS[k].n}</div><div class="text-muted text-xs">${area(v)} · ${vehOf(L,v)}</div></div>
          </${motion.div}>`
        :html`<${motion.p} key="empty" initial=${{opacity:0}} animate=${{opacity:1}} class="text-muted text-sm">${q?"Essa vaga não existe neste layout.":"Digite o número (1 a 97) para ver a transportadora."}</${motion.p}>`}
      </${AnimatePresence}>
    </div>
  </${Card}>`;
}


/* Linha fina com o resumo do layout + busca (quando Layout do SVC / Buscar vaga estão recolhidos) */
function InfoStrip({cur,L,onPick,onOpen}){
  const g=groups(L);const total=Object.keys(L.map).length-(g.V||[]).length;const bloq=(g.X||[]).length;
  const n=Object.keys(g).filter(k=>k!=="X"&&k!=="V").length;const vazio=layoutVazio(L);
  const [q,setQ]=useState("");const v=parseInt(q,10);const k=L.map[v];
  return html`<${motion.section} variants=${rise} class="md:col-span-12 glass rounded-2xl px-3 py-2 flex flex-wrap items-center gap-x-4 gap-y-2 min-w-0">
    <button type="button" onClick=${onOpen} aria-expanded="false" class="flex items-center gap-2 text-left">

    ${vazio?html`<span class="text-xs" style=${{color:"var(--amber)"}}>Layout não lido · use Ler desenho</span>`

  for(let v=1;v<=97;v++){const k=L.map[v];if(!k)continue;const c=CARRIERS[k],p=G.slots[v];

    g.fillStyle=c.fg;g.textAlign="center";g.textBaseline="middle";g.font=F(600,10);g.fillText(String(v),p.x+SZ/2,p.y+11);g.font=F(800,12);g.fillText(k,p.x+SZ/2,p.y+25);

Cada vaga é um quadrado com a sigla da transportadora: AL=ALC (preto), EC=ECO EXPRESS (bege), MS=M.J SIMÕES (cinza), HW=HAWK (azul escuro), ME=MELI EXTRA (salmão), PL=PRALOG (roxo), OT=ONTIME (amarelo), PC=PARCEIRO (branco), KG=KANGU (laranja), DL=DELUNA (verde escuro), CM=COOPMETRO (verde claro), DC=DECARGO (ciano), PY (dourado).

Perto de algumas vagas (em cima, embaixo ou ao lado) pode estar escrito o nome da gaiola/rota, ex.: VG7_CHP, A13_SD, VC1, A14. Copie exatamente como está escrito. Ignore "Passeio", "VUC" isolado, setas, "ESTEIRA", "MEZANINO", "RAMPA".

Em "vagas" coloque todas as vagas que aparecem no desenho. Em "duvidas" os números das vagas que você não conseguiu ler com certeza.`;

function detectLayoutCycleFromDrawing(vagas){
  const keys=Object.keys(LAYOUTS), scores=[];
  for(const key of keys){
    const ref=LAYOUTS[key].map||{};let hit=0,total=0,strong=0;
    for(const [vv,kk] of Object.entries(vagas||{})){
      const v=+vv,r=ref[v];if(!r||!kk||kk==="V")continue;
      total++;
      if(r===kk){hit++;if(kk!=="X")strong++}
    }
    scores.push({key,hit,total,strong,pct:total?hit/total:0});
  }
  scores.sort((a,b)=>b.pct-a.pct||b.strong-a.strong||b.hit-a.hit);
  const best=scores[0],second=scores[1];
  if(!best||best.total<20)return null;
  const margin=second?best.pct-second.pct:best.pct;
  return (best.pct>=0.62 && (margin>=0.06 || best.pct>=0.82))?best.key:null;
}

function distributeRoutes(map,tags){
  const res={...tags};const used=new Set(Object.values(res).filter(Boolean));const byK={};
  planGaiolas().forEach(r=>{if(!used.has(r.g)){(byK[r.k]=byK[r.k]||[]).push(r);used.add(r.g)}});
  let placed=0,left=0;const order=v=>rua(v)===5?1000-v:v;
  Object.keys(byK).forEach(k=>{byK[k].sort((a,b)=>(a.onda||9)-(b.onda||9)||a.g.localeCompare(b.g,"pt",{numeric:true}));
    const vs=Object.keys(map).map(Number).filter(v=>map[v]===k&&!res[v]).sort((a,b)=>rua(a)-rua(b)||order(a)-order(b));
    byK[k].forEach((r,i)=>{if(vs[i]){res[vs[i]]=r.g;placed++}else left++})});
  return {tags:res,placed,left};
}

/* ============ PLANEJAMENTO ============ */
const normTxt=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\s+/g," ").trim();
const ALIASES=[["AV",["AVTLOG","AVT LOG"]],["ME",["MELI EXTRA"]],["EC",["ECO EXPRESS","ECOEXPRESS"]],["MS",["SIMOES"]],["HW",["HAWK"]],["PL",["PRALOG"]],["OT",["ONTIME","ON TIME"]],["PC",["PARCEIRO"]],["KG",["KANGU"]],["DL",["DELUNA"]],["CM",["COOPMETRO"]],["DC",["DECARGO"]],["AL",["ALC"]],["PY",["PY"]]];
function matchCarrier(raw){const n=normTxt(raw);if(!n)return null;if(CARRIERS[n]&&n!=="X")return n;
  for(const [k,al] of ALIASES)if(al.some(a=>n===a||n.includes(a)))return k;return null}
const FIELDS=[
  {id:"gaiola",label:"Gaiola",re:/GAIOLA|CAGE/},
  {id:"rota",label:"Rota",re:/ROTA|ROUTE/},

        if(error){Object.keys(pend).forEach(k=>{if(!(k in svcPending))svcPending[k]=pend[k]});if(planWasDirty)svcPlanDirty=true;throw error}
        svcLastRemoteAt=merged.updatedAt;
        if(planWasDirty||localNewer)svcPlanSync(true);
      }else svcLastRemoteAt=row.updated_at||"";
      svcBase=merged;
      svcRemoteReady=true;
      /* mudanças feitas enquanto a gravação estava em andamento ficam pendentes; não sobrescreve a tela com elas */
      const skip=new Set(Object.keys(svcPending));
      if(svcApplier)svcApplier.apply(merged,skip);
      svcCacheRemote(merged,skip);
      svcSetStatus(true);
    }catch(e){
      console.error("SVC sync",e);svcSetStatus(false,String(e&&(e.message||e.code)||e).slice(0,60));
      if(svcPlanDirty)svcPlanSync(false,String(e&&e.message||"erro ao salvar"));
      clearTimeout(svcPushTimer);svcPushTimer=setTimeout(svcSync,5000);
    }
  });
  return svcChain;
}
function svcSyncNow(){clearTimeout(svcPushTimer);return svcSync()}
/* checagem leve: só baixa tudo se a nuvem mudou */
async function svcCheck(){
  if(!svcRemoteReady||Object.keys(svcPending).length||svcPlanDirty)return svcSyncNow();
  try{const c=await svcEnsureReady();const {data,error}=await c.from("svc_shared_state").select("updated_at").eq("state_key",SVC_STATE_KEY).maybeSingle();
    if(error)throw error;if(!data||data.updated_at!==svcLastRemoteAt)return svcSync();svcSetStatus(true)}
  catch(e){svcSetStatus(false,String(e&&(e.message||e.code)||e).slice(0,60))}
}
function svcPatchRemote(patch){
  if(svcApplyingRemote)return;
  Object.assign(svcPending,patch);svcDrawBadge();
  clearTimeout(svcPushTimer);svcPushTimer=setTimeout(svcSync,500);
}
const svcPlanSync=(ok,err)=>{window.__svcPlanSync={ok,err:err||"",at:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})};window.dispatchEvent(new Event("svc-plan-sync"))};
function svcSavePlanRemote(plan){
  if(svcApplyingRemote)return;
  svcPlanDirty=true;svcDrawBadge();
  clearTimeout(svcPushTimer);svcPushTimer=setTimeout(svcSync,200);
}
function svcCacheRemote(p,skip){
  skip=skip||new Set();
  try{
    if(p.edits&&!skip.has("edits"))localStorage.setItem("svc-edits",JSON.stringify(p.edits));
    if(p.tagOv&&!skip.has("tagOv"))localStorage.setItem("svc-tags",JSON.stringify(p.tagOv));
    if(p.geos&&!skip.has("geos"))localStorage.setItem("svc-geo9",JSON.stringify(p.geos));
    if(p.readAt&&!skip.has("readAt"))localStorage.setItem("svc-read-at",JSON.stringify(p.readAt));
    if(p.respAll&&!skip.has("respAll"))localStorage.setItem(RESP_KEY,JSON.stringify(p.respAll));
    if(Object.prototype.hasOwnProperty.call(p,"plan")&&!svcPlanDirty){
      const oldPlan=svcLocalPlan();
      if(svcPlanTime(oldPlan)<=svcPlanTime(p.plan)&&JSON.stringify(oldPlan)!==JSON.stringify(p.plan)){
        if(p.plan==null)localStorage.removeItem("svc-plan2");
        else localStorage.setItem("svc-plan2",JSON.stringify(p.plan));
        window.dispatchEvent(new CustomEvent("svc-plan-remote",{detail:p.plan}));
      }
    }
  }catch(e){}
}

function App(){
  let init="AM0-CHP";try{const s=localStorage.getItem("svc-tab");if(s&&LAYOUTS[s])init=s}catch(e){}
  const [cur,setCurRaw]=useState(init);const [filter,setFilter]=useState(null);const [sel,setSel]=useState(null);
  const setCur=k=>{if(k===cur)return;setCurRaw(k);setFilter(null);setSel(null);try{localStorage.setItem("svc-tab",k)}catch(e){}};
  const RA0=(()=>{try{return JSON.parse(localStorage.getItem("svc-read-at")||"{}")||{}}catch(e){return {}}})();
  const semData=(key)=>{try{const o=JSON.parse(localStorage.getItem(key)||"{}")||{};const n={};Object.keys(o).forEach(k=>{if(RA0[k])n[k]=o[k]});localStorage.setItem(key,JSON.stringify(n));return n}catch(e){return {}}};
  const [edits,setEdits]=useState(()=>semData("svc-edits"));
  const [hist,setHist]=useState({});
  const [respAll,setRespAll]=useState(()=>getRespAll());
  const [readAt,setReadAt]=useState(()=>{try{return JSON.parse(localStorage.getItem("svc-read-at")||"{}")}catch(e){return {}}});
  const storeReadAt=o=>{setReadAt(o);try{localStorage.setItem("svc-read-at",JSON.stringify(o))}catch(e){}svcPatchRemote({readAt:o})};
  const [geos,setGeos]=useState(()=>{try{return JSON.parse(localStorage.getItem("svc-geo9")||"{}")}catch(e){return {}}});
  const [tagOv,setTagOv]=useState(()=>semData("svc-tags"));
  const liveRef=useRef({});liveRef.current={edits,tagOv,geos,readAt,respAll};
  const applyRemote=React.useCallback((p,skip)=>{
    if(!p)return;skip=skip||new Set();
    svcApplyingRemote=true;
    try{
      if(p.edits&&!skip.has("edits"))setEdits(old=>JSON.stringify(old)===JSON.stringify(p.edits)?old:p.edits);
      if(p.tagOv&&!skip.has("tagOv"))setTagOv(old=>JSON.stringify(old)===JSON.stringify(p.tagOv)?old:p.tagOv);
      if(p.geos&&!skip.has("geos"))setGeos(old=>JSON.stringify(old)===JSON.stringify(p.geos)?old:p.geos);
      if(p.readAt&&!skip.has("readAt"))setReadAt(old=>JSON.stringify(old)===JSON.stringify(p.readAt)?old:p.readAt);
      if(p.respAll&&!skip.has("respAll"))setRespAll(old=>JSON.stringify(old)===JSON.stringify(p.respAll)?old:p.respAll);
    }finally{svcApplyingRemote=false}
  },[]);
  useEffect(()=>{
    let ch=null,alive=true,iv=null;
    /* base inicial = o que este PC tinha ao abrir; edições feitas antes de carregar a nuvem não apagam a nuvem */
    svcBase={...liveRef.current};
    svcApplier={apply:applyRemote,snapshot:()=>({...liveRef.current})};
    svcDrawBadge();
    const onVis=()=>{if(document.visibilityState==="visible")svcCheck()};
    const onOnline=()=>svcSyncNow();
    document.addEventListener("visibilitychange",onVis);window.addEventListener("focus",onVis);window.addEventListener("online",onOnline);
    const subscribe=()=>{
      if(!alive||!svcSB)return;
      if(ch){try{svcSB.removeChannel(ch)}catch(e){}ch=null}
      /* o aviso em tempo real só dispara a releitura: o conteúdo vem sempre do banco (o aviso pode vir cortado quando os dados são grandes) */
      ch=svcSB.channel("svc-shared-state-"+Math.random().toString(36).slice(2,8))
        .on("postgres_changes",{event:"*",schema:"public",table:"svc_shared_state",filter:"state_key=eq."+SVC_STATE_KEY},()=>{setTimeout(svcCheck,150)})
        .subscribe(st=>{if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED"){if(alive)setTimeout(subscribe,5000)}else if(st==="SUBSCRIBED")svcCheck()});
    };
    (async()=>{
      await svcSyncNow();
      if(!alive)return;
      try{await svcEnsureReady();subscribe()}catch(e){}
    })();
    /* garantia extra: confere a nuvem a cada 8 s mesmo se o tempo real falhar */
    iv=setInterval(()=>{if(document.visibilityState==="visible")svcCheck()},8000);
    return()=>{alive=false;clearInterval(iv);document.removeEventListener("visibilitychange",onVis);window.removeEventListener("focus",onVis);window.removeEventListener("online",onOnline);if(ch&&svcSB)svcSB.removeChannel(ch);svcApplier=null}
  },[]);

  const storeTags=o=>{setTagOv(o);try{localStorage.setItem("svc-tags",JSON.stringify(o))}catch(e){}svcPatchRemote({tagOv:o})};
  const stamp=()=>{if(!readAt[cur])storeReadAt({...readAt,[cur]:new Date().toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})})};
  const onTag=(v,t)=>{stamp();const cur2={...(tagOv[cur]||{}),[v]:t};storeTags({...tagOv,[cur]:cur2})};
  const storeGeos=o=>{setGeos(o);try{localStorage.setItem("svc-geo9",JSON.stringify(o))}catch(e){}svcPatchRemote({geos:o})};
  const storeEdits=o=>{setEdits(o);try{localStorage.setItem("svc-edits",JSON.stringify(o))}catch(e){}svcPatchRemote({edits:o})};
  const layoutOf=k=>({...LAYOUTS[k],key:k,map:edits[k]||EMPTY_MAP,tags:{},readAt:readAt[k]||null,geo:mergeGeo(geos[k]),tags:(()=>{const t={};Object.entries(tagOv[k]||{}).forEach(([v,x])=>{if(x)t[v]=x;else delete t[v]});return t})()});
  const L=useMemo(()=>layoutOf(cur),[cur,edits,geos,tagOv,readAt]);
  const snap=()=>({map:L.map,geo:geos[cur]||null,tags:tagOv[cur]||null});
  const pushHist=()=>setHist(h=>({...h,[cur]:[...(h[cur]||[]),snap()].slice(-60)}));
  const onGeo=patch=>{pushHist();const g=geos[cur]||{};const ng={...g};["slots","blocks","tags","caps"].forEach(k=>{if(patch[k])ng[k]={...(g[k]||{}),...patch[k]}});storeGeos({...geos,[cur]:ng})};
  const onEdit=nm=>{pushHist();stamp();storeEdits({...edits,[cur]:nm})};
  const onUndo=()=>{const st=hist[cur]||[];if(!st.length)return;const prev=st[st.length-1];setHist({...hist,[cur]:st.slice(0,-1)});

    const nt={...tagOv};if(prev.tags)nt[cur]=prev.tags;else delete nt[cur];storeTags(nt)};
  
  const onZero=()=>{pushHist();const ne={...edits};delete ne[cur];storeEdits(ne);storeTags({...tagOv,[cur]:{}});const nr={...readAt};delete nr[cur];storeReadAt(nr)};
  const onDistribute=()=>{pushHist();stamp();const r=distributeRoutes(L.map,L.tags);storeTags({...tagOv,[cur]:r.tags});return r};
  const onApplyRead=(t,res,dist)=>{pushHist();const m=allV();Object.entries(res.vagas).forEach(([v,k])=>m[v]=k);let tags={...res.gaiolas},placed=0;

    storeEdits({...edits,[t]:m});storeTags({...tagOv,[t]:tags});storeReadAt({...readAt,[t]:new Date().toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})});if(t!==cur)setCur(t);return {vagas:Object.keys(res.vagas).length,placed}};

  const [infoOpen,setInfoOpenRaw]=useState(()=>{try{return localStorage.getItem("svc-info-open")==="1"}catch(e){return false}});
  const setInfoOpen=v=>{setInfoOpenRaw(v);try{localStorage.setItem("svc-info-open",v?"1":"0")}catch(e){}};
  const pickFilter=k=>{setFilter(k);setSel(null)};
  return html`<div>
    <${Nav} cur=${cur} setCur=${setCur}/>
    <main class="max-w-7xl mx-auto px-4 pt-20 pb-16">
      <${motion.div} variants=${stagger} initial="hidden" animate="show" class="grid grid-cols-1 md:grid-cols-12 gap-4">
        <${MontarBar} cur=${cur} setCur=${setCur} onZero=${onZero} onApplyRead=${onApplyRead} onDistribute=${onDistribute} open=${infoOpen} setOpen=${setInfoOpen} L=${L} onPick=${pick}/>
        <${Plant} cur=${cur} L=${L} filter=${filter} sel=${sel} onPick=${pick} onEdit=${onEdit} onGeo=${onGeo} onTag=${onTag} onZero=${onZero} onApplyRead=${onApplyRead} onDistribute=${onDistribute} onUndo=${onUndo} onReset=${onReset} canUndo=${(hist[cur]||[]).length>0} edited=${!!edits[cur]||!!geos[cur]||!!(tagOv[cur]&&Object.keys(tagOv[cur]).length)}/>
      </${motion.div}>
    </main>
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
