<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guiada SVC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--bg:#07090d;--ink:#eef2f5;--muted:#8c97a3;--line:rgba(255,255,255,.09);--card:rgba(22,27,34,.72);--accent:#4cc3ff;--amber:#ffb547;--red:#ff8a8c;--green:#5ee6b0;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Onest,system-ui,sans-serif;font-size:14px}
body{min-height:100vh;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:22px 22px}
button,select,input,label.btn{font:inherit;color:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.disp{font-family:Unbounded,system-ui,sans-serif}
header{position:sticky;top:0;z-index:40;background:rgba(7,9,13,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
.hdr{height:56px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:Unbounded;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.pills{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.05);overflow-x:auto}
.pill{border:0;background:none;padding:6px 14px;border-radius:999px;color:var(--muted);cursor:pointer;white-space:nowrap;font-size:13px;font-weight:500}
.pill:hover{color:var(--ink)}
.pill.on{background:var(--ink);color:#000}
.pill.acc.on{background:var(--accent);color:#04121b}
main{padding:16px 0 60px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;min-width:0}
.ttl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid rgba(255,255,255,.2);background:none;padding:7px 14px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:rgba(255,255,255,.07)}
.btn.w{background:#fff;color:#000;border-color:#fff}
.btn.a{background:var(--accent);color:#04121b;border-color:var(--accent)}
.btn.g{background:#25d366;color:#062b16;border-color:#25d366}
.btn:disabled{opacity:.4;cursor:default}
.muted{color:var(--muted)}
.small{font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted)}
.chip.ok{background:rgba(52,211,153,.12);color:var(--green)}
.chip.warn{background:rgba(255,181,71,.12);color:var(--amber)}
.chip.err{background:rgba(229,38,42,.14);color:var(--red)}
.sw{font-family:"JetBrains Mono";font-weight:700;font-size:10px;padding:2px 6px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);display:inline-block}
.drop{border:1.5px dashed rgba(255,255,255,.2);border-radius:16px;padding:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.drop.over{border-color:var(--accent);background:rgba(76,195,255,.06)}
textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:10px;font-family:"JetBrains Mono";font-size:12px;color:var(--ink);outline:none}
select{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:12px;color:var(--ink)}
select option{background:#111}
.imgbox{background:#fff;border-radius:14px;overflow:auto;max-height:70vh}
.imgbox img{display:block;width:100%;height:auto;cursor:zoom-in}
.imgbox img.big{width:240%;max-width:none;cursor:zoom-out}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:rgba(255,255,255,.04);border-radius:14px;padding:8px 12px}
.stat b{display:block;font-family:Unbounded;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.carr{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.02)}
.carr-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px}
.carr-h .nm{font-family:Unbounded;font-size:14px}
.carr-h .tot{margin-left:auto;font-size:12px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line)}
td{padding:7px 10px;border-top:1px solid rgba(255,255,255,.05);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.vaga{font-family:"JetBrains Mono";font-weight:700;padding:1px 7px;border-radius:6px;background:var(--accent);color:#04121b}
.vaga.auto{background:rgba(76,195,255,.25);color:var(--accent)}
.sacas{font-size:11px;color:var(--amber);margin-top:2px}
.grid-c{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(520px,1fr))}
@media (max-width:640px){.grid-c{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:90;background:rgba(10,30,44,.96);color:var(--accent);border:1px solid rgba(76,195,255,.35);padding:10px 16px;border-radius:14px;font-size:13px;max-width:92vw;display:none}
.toast.on{display:block}
.empty{padding:20px;text-align:center;color:var(--muted)}
details summary{cursor:pointer}
.hide{display:none!important}
</style></head><body>
<header><div class="wrap hdr">
  <div class="brand"><span class="dot"></span>SVC<span class="muted" style="font-family:Onest">· Guiada</span></div>
  <span id="cloud" class="chip">☁ conectando…</span>
  <div style="margin-left:auto" class="pills" id="cycTabs"></div>
</div></header>

<div class="wrap"><main>

  <section class="card">
    <div class="row" style="justify-content:space-between">
      <div class="row"><span class="ttl">Painel · layout</span><span class="disp" id="lyName" style="font-size:20px"></span><span id="lyInfo" class="small muted"></span></div>
      <div class="row">
        <button class="btn" id="btnCopyLy">Copiar imagem</button>
        <button class="btn" id="btnDlLy">Baixar PNG</button>
        <button class="btn" id="btnToggleLy">Esconder</button>
      </div>
    </div>
    <div id="lyBody" style="margin-top:10px">
      <div class="imgbox"><img id="lyImg" alt="Imagem do layout"></div>
      <p class="small muted" id="lyNote" style="margin:8px 0 0"></p>
    </div>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between">
      <span class="ttl">Planejamento</span>
      <div class="row" id="planChips"></div>
    </div>
    <div class="drop" id="drop" style="margin-top:10px">
      <div style="flex:1;min-width:220px"><b>Solte o planejamento aqui</b><div class="small muted">.xlsx, .xls ou .csv · gera ruas, ondas, paradas e pacotes por rota</div></div>
      <label class="btn w" for="planFile" style="cursor:pointer">Escolher arquivo</label>
      <input id="planFile" type="file" accept=".xlsx,.xls,.xlsm,.csv,.txt" style="display:none">
      <button class="btn" id="btnPaste">Colar do Excel</button>
      <button class="btn" id="btnClearPlan" style="border-color:rgba(229,38,42,.6);color:var(--red)">Limpar</button>
    </div>
    <div id="pasteBox" class="hide" style="margin-top:10px"><label class="small muted" for="pasteTa">Copie no Excel (com o cabeçalho) e cole aqui:</label><textarea id="pasteTa" rows="3"></textarea></div>
    <p id="planErr" class="small" style="color:var(--red);margin:8px 0 0"></p>
    <details id="mapBox" class="hide" style="margin-top:8px"><summary class="small muted">Colunas usadas da planilha (mude se alguma estiver errada)</summary>
      <div class="row" id="mapSel" style="margin-top:8px;gap:12px"></div></details>
  </section>

  <section class="card" id="guiadaCard">
    <div class="row" style="justify-content:space-between">
      <div class="row"><span class="ttl">Guiada</span><span class="small muted" id="gSub"></span></div>
      <div class="row">
        <button class="btn g" id="btnImgOnda">Imagem desta onda</button>
        <button class="btn" id="btnTxtOnda">Copiar texto</button>
        <button class="btn" id="btnAllImgs">Baixar todas as ondas</button>
      </div>
    </div>
    <div class="row" style="margin-top:10px"><div class="pills" id="ondaTabs"></div></div>
    <div class="row" style="margin-top:8px" id="carrFilter"></div>
    <div class="stats" id="stats" style="margin-top:10px"></div>
    <div id="gBody" class="grid-c" style="margin-top:10px"></div>
    <div id="imgPrev" class="hide" style="margin-top:12px">
      <div class="row" style="justify-content:space-between"><span class="ttl">Imagem da guiada</span><div class="row"><button class="btn w" id="btnCopyG">Copiar</button><button class="btn" id="btnDlG">Baixar PNG</button><button class="btn" id="btnShareG">Compartilhar</button><button class="btn" id="btnCloseG">Fechar</button></div></div>
      <div class="imgbox" style="margin-top:8px;max-height:80vh"><img id="gImg" alt="Guiada da onda" style="width:min(540px,100%);margin:0 auto"></div>
    </div>
  </section>

</main></div>
<div class="toast" id="toast"></div>

<script>
const SVC_LIBS={};
function svcLoadOne(url){return new Promise((resolve,reject)=>{const e=document.createElement("script");e.src=url;e.async=true;e.onload=()=>resolve(true);e.onerror=()=>{e.remove();reject(new Error("Falha "+url))};document.head.appendChild(e)})}
/* tenta cada endereço em ordem: se a rede da empresa bloquear um CDN, usa o próximo */
function svcLoadScript(key,urls,ok){
  if(SVC_LIBS[key])return SVC_LIBS[key];
  urls=[].concat(urls);
  SVC_LIBS[key]=(async()=>{for(const u of urls){try{await svcLoadOne(u);if(!ok||ok())return true}catch(e){}}delete SVC_LIBS[key];throw new Error("Falha ao carregar "+key)})();
  return SVC_LIBS[key];
}
const ensureXLSX=()=>window.XLSX?Promise.resolve(true):svcLoadScript("xlsx",["https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js","https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js","https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"],()=>!!window.XLSX);
const ensureJSPDF=()=>window.jspdf?Promise.resolve(true):svcLoadScript("jspdf",["https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js","https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js","https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"],()=>!!window.jspdf);
const ensureSupabaseLib=()=>window.supabase?Promise.resolve(true):svcLoadScript("supabase",["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2","https://unpkg.com/@supabase/supabase-js@2"],()=>!!window.supabase);
/* lê CSV/TXT respeitando a codificação (UTF-8, UTF-16 do Excel "Texto Unicode" ou ANSI/Latin-1) */
async function svcReadText(f){const buf=new Uint8Array(await f.arrayBuffer());
  if(buf[0]===0xFF&&buf[1]===0xFE)return new TextDecoder("utf-16le").decode(buf.subarray(2));
  if(buf[0]===0xFE&&buf[1]===0xFF)return new TextDecoder("utf-16be").decode(buf.subarray(2));
  if(buf.length>3&&buf[1]===0&&buf[3]===0&&buf[0]!==0)return new TextDecoder("utf-16le").decode(buf);
  try{return new TextDecoder("utf-8",{fatal:true}).decode(buf).replace(/^\uFEFF/,"")}catch(e){return new TextDecoder("windows-1252").decode(buf)}}
/* abre qualquer planilha (xlsx/xls/xlsm/csv/txt) e devolve o workbook */
async function svcReadWorkbook(f,opts){await ensureXLSX();
  if(/\.(csv|txt|tsv)$/i.test(f.name)){let t=await svcReadText(f);const first=(t.split(/\r?\n/).find(l=>l.trim())||"");
    if(first.includes("\t"))return XLSX.read(t,{type:"string",raw:true,FS:"\t",...(opts||{})});
    if(first.split(";").length>first.split(",").length)return XLSX.read(t,{type:"string",raw:true,FS:";",...(opts||{})});
    return XLSX.read(t,{type:"string",raw:true,...(opts||{})})}
  return XLSX.read(new Uint8Array(await f.arrayBuffer()),{type:"array",...(opts||{})})}
/* ============ DADOS ============ */
const CARRIERS={
  AL:{n:"ALC",bg:"#111111",fg:"#ffffff"},
  EC:{n:"ECO EXPRESS",bg:"#f6e2c0",fg:"#1b1b1b"},
  MS:{n:"M.J SIMÕES",bg:"#8a8a8a",fg:"#ffffff"},
  HW:{n:"HAWK",bg:"#16357a",fg:"#ffffff"},
  ME:{n:"MELI EXTRA",bg:"#f4c7ad",fg:"#1b1b1b"},
  PL:{n:"PRALOG",bg:"#7b5ea7",fg:"#ffffff"},
  OT:{n:"ONTIME",bg:"#ffef2e",fg:"#1b1b1b"},
  PC:{n:"PARCEIRO",bg:"#ffffff",fg:"#1b1b1b"},
  KG:{n:"KANGU",bg:"#f39200",fg:"#1b1b1b"},
  DL:{n:"DELUNA",bg:"#4f7a2e",fg:"#ffffff"},
  CM:{n:"COOPMETRO",bg:"#22e024",fg:"#1b1b1b"},
  DC:{n:"DECARGO",bg:"#22e6ea",fg:"#1b1b1b"},
  PY:{n:"PY",bg:"#b8860b",fg:"#ffffff"},
  X:{n:"Bloqueada",bg:"#e5262a",fg:"#ffffff"},
  V:{n:"Vazia",bg:"#e9ecef",fg:"#8a929b"}
};
function fill(o,a,b,code,s=1){if(a<=b){for(let i=a;i<=b;i+=s)o[i]=code}else{for(let i=a;i>=b;i-=s)o[i]=code}return o}
const build=steps=>{const o={};steps.forEach(st=>fill(o,...st));return o};
const LAYOUTS={
  "AM0-CHP":{map:build([[1,31,"X",2],[2,4,"AL",2],[6,8,"CM",2],[10,20,"KG",2],[22,26,"MS",2],[28,34,"X",2],
    [35,43,"HW"],[44,44,"X"],[45,49,"OT"],[50,50,"X"],[51,52,"DC"],[53,53,"X"],[54,54,"EC"],[55,55,"X"],[56,56,"DL"],[57,65,"X"],
    [88,76,"X"],[75,75,"DL"],[74,72,"EC"],[71,71,"OT"],[70,69,"PC"],[68,67,"HW"],[66,66,"CM"],[89,97,"X"]]),
    tags:{},veh:{top:"Passeio",bot:"VUC",right:"VUC"}},
  "AM":{map:build([[1,31,"ME",2],[2,8,"PC",2],[10,22,"KG",2],[24,34,"ME",2],
    [35,38,"PC"],[39,45,"DL"],[46,49,"MS"],[50,54,"AL"],[55,60,"DC"],[61,65,"X"],
    [88,79,"HW"],[78,74,"CM"],[73,73,"PY"],[72,69,"EC"],[68,66,"OT"],[89,97,"X"]]),
    tags:{},veh:{top:"Passeio",bot:"Passeio",right:"VUC"}},
  "PM":{map:build([[1,9,"DC",2],[11,17,"MS",2],[19,23,"EC",2],[25,31,"CM",2],[2,4,"KG",2],[6,6,"PY"],[8,14,"OT",2],[16,22,"DL",2],[24,34,"PC",2],
    [35,39,"KG"],[40,65,"ME"],
    [88,83,"HW"],[82,81,"AL"],[80,77,"DL"],[76,76,"DC"],[75,75,"OT"],[74,74,"EC"],[73,72,"PC"],[71,66,"HW"],[89,97,"HW"]]),
    tags:{},veh:{top:"Passeio",bot:"VUC",right:"VUC"}},
  "SD":{map:build([[1,31,"X",2],[2,6,"DC",2],[8,8,"EC"],[10,14,"OT",2],[16,20,"MS",2],[22,34,"HW",2],
    [35,37,"PC"],[38,40,"DL"],[41,42,"CM"],[43,50,"KG"],[51,65,"X"],[88,66,"X"],[89,97,"X"]]),
    tags:{},
    tagBelow:true,veh:{top:"Passeio",bot:"—",right:"VUC"}}
};
const rua=v=>v<=34?(v%2?1:2):v<=65?3:v<=88?5:4;
const area=v=>["","Rua 1 · coluna esquerda (ímpares)","Rua 2 · coluna esquerda (pares)","Rua 3 · ao lado da esteira","Rua 4 · lado direito (VUC)","Rua 5 · frente do mezanino (expedição VUC)"][rua(v)];
const vehOf=(L,v)=>v<=34?"—":v<=65?L.veh.top:v<=88?L.veh.bot:L.veh.right;
const SZ=36,STEP=42;
function pos(v){
  if(v<=34){const r=Math.floor((v-1)/2);return{x:v%2?40:86,y:98+r*STEP}}
  if(v<=65)return{x:128+(v-35)*STEP,y:56};
  if(v<=88)return{x:204+(88-v)*STEP,y:606};
  return{x:1320,y:250+(v-89)*STEP};
}
const BLOCKS_DEF={
  rampaS:{x:10,y:8,w:80,h:40,t:"RAMPA\nSAÍDA"},rampaU:{x:1300,y:130,w:98,h:40,t:"RAMPA ↑"},rampaU1:{x:1300,y:760,w:98,h:44,t:"RAMPA ↑ 1"},
  est1:{x:250,y:214,w:1000,h:24,t:"ESTEIRA"},est2:{x:250,y:296,w:1000,h:24,t:"ESTEIRA"},mez:{x:250,y:388,w:480,h:58,t:"MEZANINO"},
  exp:{x:190,y:592,w:986,h:66,t:"",dashed:true}};
const TAGS_DEF={1:{x:36,y:70},2:{x:84,y:70},3:{x:128,y:4},4:{x:1316,y:222},5:{x:204,y:578}};
const CAPS_DEF={3:{x:200,y:140},5:{x:204,y:684},4:{x:1250,y:636}};
// onde fica o nome da gaiola/rota em relação à vaga (x = centro do rótulo, ou esquerda se side)
const shortTag=t=>String(t||"").replace(/_[A-Z]{2,4}\d*$/i,"");
function tagPlace(v,below,len){const r=rua(v);const two=len>5&&v%2===0;
  if(r===3)return below?{cx:SZ/2,y:SZ+3+(two?17:0)}:{cx:SZ/2,y:two?-35:-18};
  if(r===5)return{cx:SZ/2,y:SZ+3+(two?17:0)};
  if(r===1)return{left:true,y:SZ/2-8};
  return{side:true,x:SZ+4,y:SZ/2-8}}
function mergeGeo(p){p=p||{};const slots={};for(let v=1;v<=97;v++)slots[v]=(p.slots&&p.slots[v])||pos(v);
  const blocks={};Object.keys(BLOCKS_DEF).forEach(k=>blocks[k]={...BLOCKS_DEF[k],...((p.blocks||{})[k]||{})});
  const tags={},caps={};[1,2,3,4,5].forEach(n=>{tags[n]=(p.tags||{})[n]||TAGS_DEF[n];if(CAPS_DEF[n])caps[n]=(p.caps||{})[n]||CAPS_DEF[n]});
  return {slots,blocks,tags,caps}}
function geoBounds(G){let W=0,H=0;Object.values(G.slots).forEach(p=>{W=Math.max(W,p.x+SZ);H=Math.max(H,p.y+SZ)});
  Object.values(G.blocks).forEach(b=>{W=Math.max(W,b.x+b.w);H=Math.max(H,b.y+b.h)});Object.values(G.caps).forEach(c=>{W=Math.max(W,c.x+150);H=Math.max(H,c.y+16)});
  return {W:Math.max(W+12,400),H:Math.max(H+16,300)}}
const capText=(L,n)=>n===3?"Rua 3 · "+L.veh.top+"   ←   sentido de saída":n===5?"Rua 5 · Expedição VUC"+(L.veh.bot&&L.veh.bot!=="—"?" · "+L.veh.bot:""):"Rua 4 · "+L.veh.right;
const allV=()=>{const m={};for(let v=1;v<=97;v++)m[v]="V";return m};
const EMPTY_MAP=allV();
const layoutVazio=L=>!Object.values(L.map).some(k=>k!=="V");
function groups(L){const g={};Object.entries(L.map).forEach(([v,k])=>(g[k]=g[k]||[]).push(+v));Object.values(g).forEach(a=>a.sort((x,y)=>x-y));return g}
function ranges(arr){const out=[];let i=0;while(i<arr.length){let j=i;const step=(arr[i]<=34&&arr[i+1]-arr[i]===2)?2:1;
  while(j+1<arr.length&&arr[j+1]-arr[j]===step&&(step===1||arr[j+1]<=34))j++;
  out.push(j>i?`${arr[i]}–${arr[j]}${step===2?" (ímpar/par)":""}`:`${arr[i]}`);i=j+1}return out.join(", ")}

async function renderLayoutPNG(cur,L){
  try{await document.fonts.ready}catch(e){}
  const G=L.geo,{W:MW,H:MH}=geoBounds(G);
  const K=2,PAD=24,TOP=78,LEG_H=36;
  const counts={};Object.values(L.map).forEach(k=>counts[k]=(counts[k]||0)+1);
  const legend=Object.keys(CARRIERS).filter(k=>counts[k]);
  const cols=5,legRows=Math.ceil(legend.length/cols);
  const W=MW+PAD*2,H=TOP+MH+28+legRows*LEG_H+PAD+44;
  const cv=document.createElement("canvas");cv.width=W*K;cv.height=H*K;const g=cv.getContext("2d");g.scale(K,K);
  const F=(w,s)=>`${w} ${s}px Onest, Arial, sans-serif`;
  const rr=(x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()};

      pc?`<span class="chip ${pc===S.cyc?"ok":"warn"}">Ciclo ${pc}${CICLO_TAG?" · "+CICLO_TAG:""}${pc!==S.cyc?" · layout aberto: "+S.cyc:""}</span>`:"",
      `<span class="chip">${plural(routes.length,"rota","rotas")}</span>`,
      m.pacotes?`<span class="chip ok">pacotes ← ${esc(m.pacotes)}</span>`:`<span class="chip warn">sem coluna de pacotes</span>`,
      `<span class="chip">importado ${esc(p.at)}</span>`].join(""):`<span class="chip warn">nenhum planejamento</span>`;
  $("mapBox").classList.toggle("hide",!p);
  if(p)$("mapSel").innerHTML=FIELDS.filter(f=>["transp","rota","gaiola","onda","parada","pacotes","modal"].includes(f.id)).map(f=>`<label class="small muted" style="display:flex;flex-direction:column;gap:4px">${f.label}
    <select data-map="${f.id}"><option value="">— não tem —</option>${p.headers.map(h=>`<option ${m[f.id]===h?"selected":""} value="${esc(h)}">${esc(h)}</option>`).join("")}</select></label>`).join("");
  // layout
  const g=groups(L0);const vazio=layoutVazio(L0);
  $("lyName").textContent=S.cyc;
  const nTag=routes.filter(r=>r.vaga&&!r.auto).length,nAuto=routes.filter(r=>r.auto).length,nSem=routes.filter(r=>!r.vaga).length;
  $("lyInfo").textContent=vazio?"· layout ainda não montado no painel":`· ${Object.keys(L0.map).length-(g.V||[]).length-(g.X||[]).length} vagas ativas${L0.readAt?" · montado "+L0.readAt:""}`;
  $("lyNote").innerHTML=vazio?`<span style="color:var(--amber)">O layout ${S.cyc} ainda não foi montado no painel. Monte lá e esta página atualiza sozinha.</span>`
    :routes.length?`${nTag} rotas com gaiola marcada no painel · ${nAuto} colocadas em vaga livre da transportadora${nSem?` · <span style="color:var(--amber)">${nSem} sem vaga no layout</span>`:""}`:"Suba o planejamento para ver as rotas nas vagas.";
  if(redrawLayout)drawLayout();
  // guiada
  const os=ondas();const list=cur();
  $("gSub").textContent=routes.length?`· ciclo ${GUIADA_CICLO} · layout ${S.cyc}`:"";
  $("ondaTabs").innerHTML=routes.length?[...os.map(o=>`<button class="pill acc ${S.onda===o?"on":""}" data-onda="${o}">${ondaLbl(o)} <span class="mono" style="opacity:.7">${routes.filter(r=>ondaKey(r)===o).length}</span></button>`),
    `<button class="pill acc ${S.onda==="all"?"on":""}" data-onda="all">Todas</button>`].join(""):"";
  const base=S.onda==="all"?routes:routes.filter(r=>ondaKey(r)===S.onda);
  const cs=groupCarr(base);
  $("carrFilter").innerHTML=routes.length?[`<button class="pill ${!S.carr?"on":""}" data-carr="">Todas as transportadoras</button>`,
    ...cs.map(c=>{const id=c.k||("~"+normTxt(c.routes[0].transpRaw));return `<button class="pill ${S.carr===id?"on":""}" data-carr="${esc(id)}" style="display:inline-flex;gap:6px;align-items:center">${sw(c.k)} ${esc(c.name)} <span class="mono" style="opacity:.7">${c.routes.length}</span></button>`})].join(""):"";
  const tp=list.reduce((a,r)=>a+r.parTot,0),tk=list.some(r=>r.pacTot!=null)?list.reduce((a,r)=>a+(r.pacTot||0),0):null;
  $("stats").innerHTML=routes.length?[["Rotas",list.length],["Paradas",tp],["Pacotes",tk],["Transportadoras",groupCarr(list).length]].map(([l,v])=>`<div class="stat"><span class="small muted">${l}</span><b>${fmt(v)}</b></div>`).join(""):"";
  $("gBody").innerHTML=!routes.length?`<div class="empty">Suba o planejamento para gerar a guiada por onda e transportadora.</div>`
    :groupCarr(list).map(carrBlock).join("");
  ["btnImgOnda","btnTxtOnda","btnAllImgs"].forEach(id=>$(id).disabled=!routes.length);
}
function carrBlock(c){const C=CARRIERS[c.k]||{bg:"#4b5563",fg:"#fff"};
  const par=c.routes.reduce((a,r)=>a+r.parTot,0),pac=c.routes.some(r=>r.pacTot!=null)?c.routes.reduce((a,r)=>a+(r.pacTot||0),0):null;
  const showOnda=S.onda==="all";
  return `<div class="carr"><div class="carr-h" style="background:${C.bg};color:${C.fg}"><span class="nm">${c.k?c.k+" · ":""}${esc(c.name)}</span>
    <span class="tot">${plural(c.routes.length,"rota","rotas")} · ${fmt(par)} paradas${pac!=null?" · "+fmt(pac)+" pacotes":""}</span></div>
    <table><thead><tr><th>Gaiola / rota</th>${showOnda?'<th>Onda</th>':''}<th>Rua</th><th>Vaga</th><th class="n">Paradas</th><th class="n">Pacotes</th></tr></thead><tbody>
    ${c.routes.map(r=>`<tr><td><b class="mono">${esc(shortTag(gName(r)))}</b>${gName(r)!==r.rota&&r.rota?`<span class="muted small"> · ${esc(r.rota)}</span>`:""}${r.children.length?`<div class="sacas">${plural(r.children.length,"saca","sacas")}: ${esc(sacaTxt(r))}</div>`:""}</td>
      ${showOnda?`<td>${r.onda??"—"}</td>`:""}<td>${r.rua?"Rua "+r.rua:"—"}</td><td>${r.vaga?`<span class="vaga ${r.auto?"auto":""}" title="${r.auto?"Vaga livre da transportadora (sem gaiola marcada no painel)":"Gaiola marcada no painel"}">${r.vaga}</span>`:'<span class="muted">sem vaga</span>'}</td>
      <td class="n mono">${fmt(r.parTot||null)}</td><td class="n mono">${fmt(r.pacTot)}</td></tr>`).join("")}
    </tbody></table></div>`}

/* ============ IMAGEM DO PAINEL ============ */
let drawSeq=0;
async function drawLayout(){const my=++drawSeq;const L={...L0,tags:{...L0.tags}};
  routes.forEach(r=>{if(r.vaga&&!L.tags[r.vaga])L.tags[r.vaga]=shortTag(gName(r))});
  try{const b=await renderLayoutPNG(S.cyc,L);if(my!==drawSeq)return;if(S.lyUrl)URL.revokeObjectURL(S.lyUrl);S.lyBlob=b;S.lyUrl=URL.createObjectURL(b);$("lyImg").src=S.lyUrl}catch(e){console.error(e)}}

/* ============ IMAGEM DA GUIADA (por onda, separada por transportadora) ============ */
async function guiadaPNG(onda){
  try{await document.fonts.ready}catch(e){}
  const list=onda==="all"?routes:routes.filter(r=>ondaKey(r)===onda);const cs=groupCarr(S.carr?list.filter(r=>(r.k||"~"+normTxt(r.transpRaw))===S.carr):list);
  const W=1080,P=32,RH=64,CH=70,TH=46;const showO=onda==="all";
  let H=190;cs.forEach(c=>{H+=CH+TH+c.routes.length*RH+18});H+=80;
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const g=cv.getContext("2d");
  const F=(w,s)=>`${w} ${s}px Onest, Arial, sans-serif`;
  const rr=(x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()};
  const fit=(t,max)=>{t=String(t);while(g.measureText(t).width>max&&t.length>2)t=t.slice(0,-1);return t};
  g.fillStyle="#f4f6f8";g.fillRect(0,0,W,H);g.fillStyle="#0a4d8c";g.fillRect(0,0,W,150);
  g.fillStyle="#fff";g.textBaseline="alphabetic";g.textAlign="left";g.font=F(800,56);g.fillText("GUIADA · "+(onda==="all"?"TODAS AS ONDAS":ondaLbl(onda).toUpperCase()),P,80);
  const tp=list.reduce((a,r)=>a+r.parTot,0),tk=list.some(r=>r.pacTot!=null)?list.reduce((a,r)=>a+(r.pacTot||0),0):null;
  g.font=F(600,26);g.fillText(`Ciclo ${GUIADA_CICLO} · Layout ${S.cyc} · ${new Date().toLocaleDateString("pt-BR")}`,P,124);
  g.textAlign="right";g.font=F(700,24);g.fillText(`${plural(list.length,"rota","rotas")} · ${fmt(tp)} par.${tk!=null?" · "+fmt(tk)+" pac.":""}`,W-P,124);
  const cols=[{t:"GAIOLA",x:P+26,al:"left"},...(showO?[{t:"ONDA",x:470,al:"center"}]:[]),{t:"RUA",x:showO?590:560,al:"center"},{t:"VAGA",x:showO?710:700,al:"center"},{t:"PARADAS",x:850,al:"center"},{t:"PACOTES",x:985,al:"center"}];
  let y=176;
  cs.forEach(c=>{const C=CARRIERS[c.k]||{bg:"#9ca3af",fg:"#fff"};
    g.fillStyle=C.bg;rr(P,y,W-2*P,CH-12,12);g.fill();g.strokeStyle="rgba(0,0,0,.28)";g.lineWidth=2;g.stroke();
    g.fillStyle=C.fg;g.textAlign="left";g.textBaseline="middle";g.font=F(800,32);g.fillText(fit((c.k?c.k+"  ·  ":"")+c.name,560),P+20,y+(CH-12)/2+1);
    const par=c.routes.reduce((a,r)=>a+r.parTot,0),pac=c.routes.some(r=>r.pacTot!=null)?c.routes.reduce((a,r)=>a+(r.pacTot||0),0):null;
    g.textAlign="right";g.font=F(700,22);g.fillText(`${plural(c.routes.length,"rota","rotas")} · ${fmt(par)} par.${pac!=null?" · "+fmt(pac)+" pac.":""}`,W-P-20,y+(CH-12)/2+1);
    y+=CH;g.fillStyle="#374151";rr(P,y,W-2*P,TH-8,10);g.fill();g.fillStyle="#fff";g.font=F(800,20);cols.forEach(cc=>{g.textAlign=cc.al;g.fillText(cc.t,cc.x,y+(TH-8)/2+1)});y+=TH;
    c.routes.forEach((r,i)=>{g.fillStyle=i%2?"#eef1f5":"#fff";rr(P,y+2,W-2*P,RH-6,10);g.fill();g.fillStyle=C.bg;rr(P,y+2,10,RH-6,5);g.fill();
      const cy=y+RH/2-1;g.textBaseline="middle";g.fillStyle="#111";g.textAlign="left";g.font=F(800,32);const nm=fit(shortTag(gName(r)),(showO?400:460)-P-26);g.fillText(nm,cols[0].x,r.children.length?cy-9:cy);
      if(r.children.length){g.font=F(700,16);g.fillStyle="#b45309";g.fillText(fit(plural(r.children.length,"saca","sacas")+": "+sacaTxt(r),(showO?400:460)-P-26),cols[0].x,cy+17)}
      g.fillStyle="#111";g.font=F(800,30);let ci=1;
      if(showO){g.textAlign="center";g.fillText(r.onda!=null?String(r.onda):"—",cols[ci].x,cy);ci++}
      g.textAlign="center";g.fillText(r.rua?String(r.rua):"—",cols[ci].x,cy);ci++;
      if(r.vaga){g.fillStyle=r.auto?"#3b82c4":"#0a4d8c";rr(cols[ci].x-44,y+12,88,RH-26,10);g.fill();g.fillStyle="#fff";g.fillText(String(r.vaga),cols[ci].x,cy)}else{g.fillStyle="#9ca3af";g.fillText("—",cols[ci].x,cy)}ci++;
      g.fillStyle="#111";g.fillText(r.parTot?String(r.parTot):"—",cols[ci].x,cy);ci++;g.fillText(r.pacTot!=null?String(r.pacTot):"—",cols[ci].x,cy);
      y+=RH});
    y+=18});
  g.fillStyle="#0a4d8c";g.fillRect(0,H-64,W,64);g.fillStyle="#fff";g.font=F(700,24);g.textAlign="center";g.textBaseline="middle";g.fillText(`GUIADA · ${GUIADA_CICLO} · ${onda==="all"?"todas as ondas":ondaLbl(onda)} · Operação MEGARIO`,W/2,H-32);
  return await new Promise(r=>cv.toBlob(r,"image/png"))}
function guiadaText(onda){const list=onda==="all"?routes:routes.filter(r=>ondaKey(r)===onda);const cs=groupCarr(S.carr?list.filter(r=>(r.k||"~"+normTxt(r.transpRaw))===S.carr):list);
  let t=`*GUIADA – ${onda==="all"?"TODAS AS ONDAS":ondaLbl(onda).toUpperCase()}*\nCiclo ${GUIADA_CICLO} · Layout ${S.cyc} · ${new Date().toLocaleDateString("pt-BR")}\n`;
  cs.forEach(c=>{t+=`\n▸ *${c.name}*\nGAIOLA | RUA | VAGA | PARADAS | PACOTES\n`;
    c.routes.forEach(r=>{t+=`${shortTag(gName(r))}${r.children.length?" (sacas "+sacaTxt(r)+")":""} | ${r.rua||"—"} | ${r.vaga||"—"} | ${r.parTot||"—"} | ${r.pacTot!=null?r.pacTot:"—"}\n`})});
  return t}
const fname=s=>`${s}-${GUIADA_CICLO}-${new Date().toLocaleDateString("pt-BR").replace(/\//g,"-")}`;
function download(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function copyImg(blob){try{await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);toast("Imagem copiada. Cole no grupo com Ctrl+V.")}catch(e){toast("Este navegador não deixou copiar. Use Baixar PNG.")}}

/* ============ EVENTOS ============ */
document.addEventListener("click",async e=>{const t=e.target.closest("[data-cyc],[data-onda],[data-carr]");if(!t)return;
  if(t.dataset.cyc){S.cyc=t.dataset.cyc;S.cycManual=true;render(true);return}
  if(t.dataset.onda){S.onda=t.dataset.onda;S.carr=null;render(false);return}
  if(t.hasAttribute("data-carr")){S.carr=t.dataset.carr||null;render(false)}});
document.addEventListener("change",e=>{const s=e.target.closest("[data-map]");if(!s||!S.plan)return;const m={...S.plan.map,[s.dataset.map]:s.value||undefined};savePlan({...S.plan,map:m})});
$("planFile").onchange=e=>{onFile(e.target.files[0]);e.target.value=""};
const drop=$("drop");drop.ondragover=e=>{e.preventDefault();drop.classList.add("over")};drop.ondragleave=()=>drop.classList.remove("over");
drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");onFile(e.dataTransfer.files[0])};
$("btnPaste").onclick=()=>{$("pasteBox").classList.toggle("hide");$("pasteTa").focus()};
$("pasteTa").onpaste=e=>{e.preventDefault();onPaste(e.clipboardData.getData("text"))};
$("btnClearPlan").onclick=()=>{if(!confirm("Limpar o planejamento desta página?"))return;S.plan=null;localStorage.removeItem("svc-guiada-plan");S.cycManual=false;render(true)};
$("btnToggleLy").onclick=()=>{S.lyHidden=!S.lyHidden;lsSet("svc-guiada-lyhide",S.lyHidden);$("lyBody").classList.toggle("hide",S.lyHidden);$("btnToggleLy").textContent=S.lyHidden?"Mostrar":"Esconder"};
$("lyImg").onclick=e=>e.target.classList.toggle("big");
$("btnDlLy").onclick=()=>S.lyBlob&&download(S.lyBlob,fname("layout-svc")+".png");
$("btnCopyLy").onclick=()=>S.lyBlob&&copyImg(S.lyBlob);
$("btnImgOnda").onclick=async()=>{const b=await guiadaPNG(S.onda);S.gBlob=b;if(S.gUrl)URL.revokeObjectURL(S.gUrl);S.gUrl=URL.createObjectURL(b);$("gImg").src=S.gUrl;$("imgPrev").classList.remove("hide");$("imgPrev").scrollIntoView({behavior:"smooth",block:"start"})};
$("btnTxtOnda").onclick=async()=>{try{await navigator.clipboard.writeText(guiadaText(S.onda));toast("Texto da guiada copiado.")}catch(e){toast("Não deu para copiar aqui.")}};
$("btnAllImgs").onclick=async()=>{const os=ondas();for(const o of os){const b=await guiadaPNG(o);download(b,fname("guiada-"+(o==="s"?"sem-onda":"onda-"+o))+".png");await new Promise(r=>setTimeout(r,350))}toast(plural(os.length,"imagem baixada","imagens baixadas"))};
$("btnCopyG").onclick=()=>S.gBlob&&copyImg(S.gBlob);
$("btnDlG").onclick=()=>S.gBlob&&download(S.gBlob,fname("guiada-"+(S.onda==="all"?"todas":S.onda==="s"?"sem-onda":"onda-"+S.onda))+".png");
$("btnShareG").onclick=async()=>{if(!S.gBlob)return;const f=new File([S.gBlob],fname("guiada")+".png",{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],text:guiadaText(S.onda)})}catch(e){}}else copyImg(S.gBlob)};
$("btnCloseG").onclick=()=>$("imgPrev").classList.add("hide");

/* ============ INÍCIO ============ */
S.plan=lsGet("svc-guiada-plan");S.lyHidden=!!lsGet("svc-guiada-lyhide");$("lyBody").classList.toggle("hide",S.lyHidden);$("btnToggleLy").textContent=S.lyHidden?"Mostrar":"Esconder";
ensureXLSX().catch(()=>{});
loadCloud();setInterval(()=>{if(document.visibilityState==="visible")loadCloud()},10000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")loadCloud()});
</script>
